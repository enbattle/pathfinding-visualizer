name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancels a run still in progress for the same branch/PR when a new commit lands on it — otherwise
# every push to an active PR queues a full run that's obsolete before it even finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: no job pushes, comments, or writes anything.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (tags can be moved to point at other code); the comment
# records the version. Dependabot keeps the pins current (.github/dependabot.yml).
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Docs must only refer to paths, scripts and identifiers that exist.
      - run: npm run check:docs
      - run: npm run test:run
      - run: npm run build
      - run: npm run check:bundle
      # Fails on known high/critical vulnerabilities in any dependency.
      - run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the production bundle and tests it through `vite preview` (see playwright.config.ts).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Report-only: timings on shared runners vary too much to gate on. The results land in the run's
  # summary page, so a big regression is visible in review.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run benchmarks
        run: |
          npm run bench 2>&1 | tee bench.txt
          {
            echo '## Engine benchmarks (100x100 board)'
            echo '```'
            grep -E '^\s+(name|bfs|dfs|greedy|dijkstra|astar|prims|recursive)|✓' bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
