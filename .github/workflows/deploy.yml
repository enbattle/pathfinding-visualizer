name: Deploy

on:
  push:
    branches: [main]
  # Lets the deploy be re-run manually from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy should ever be in flight; a second push should wait for the
# first to finish rather than race it, so this isn't cancel-in-progress.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to full commit SHAs; the comment records the version.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache for the artifact that gets published: a clean install from the lockfile
      # can't be affected by a poisoned cache entry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # Re-checked here so a broken commit can't ship even if CI was skipped or is still running.
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npm run check:bundle
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
