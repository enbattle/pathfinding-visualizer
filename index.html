<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" href="%BASE_URL%slime-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0e14" />

      name="description"
      content="Interactive visualizer for pathfinding (BFS, DFS, Dijkstra, A*, Greedy) and maze-generation algorithms."
